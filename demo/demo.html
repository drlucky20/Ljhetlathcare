<title>Doctor LJ Daily Dashboard</title>
<style>:root{
  --bg:#f3f6f7;--card:#fff;--ink:#14272b;--muted:#5d7176;--line:#dbe4e6;
  --brand:#2f3e7c;--brand-ink:#fff;--danger:#b3261e;--ok:#1b7a3d;--warn:#a15c00;
  --s1:#2f3e7c;--s2:#d9822b;--s3:#3a8fe0;--s4:#c2477a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1c;--card:#172427;--ink:#e6f0f1;--muted:#93aab0;--line:#2a3d41;
  --brand:#78b2f0;--brand-ink:#0b1a33;--danger:#ff8a80;--ok:#6fd08c;--warn:#f0b35a;
  --s1:#78b2f0;--s2:#f0a050;--s3:#8c9cf2;--s4:#ec7fae;}}
:root[data-theme="dark"]{
  --bg:#0f1a1c;--card:#172427;--ink:#e6f0f1;--muted:#93aab0;--line:#2a3d41;
  --brand:#78b2f0;--brand-ink:#0b1a33;--danger:#ff8a80;--ok:#6fd08c;--warn:#f0b35a;
  --s1:#78b2f0;--s2:#f0a050;--s3:#8c9cf2;--s4:#ec7fae;}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
header.top .brand{font-weight:700;color:var(--brand);font-size:18px}
header.top .who{margin-left:auto;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.card h2{font-size:17px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);flex:1 1 160px}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px;flex:1 1 100%}
input,select,textarea,button{font:inherit}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
textarea{min-height:60px;resize:vertical}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.badge{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.badge b{color:var(--brand)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.table-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.login{max-width:360px;margin:12vh auto}
.login label{margin:10px 0;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:24px;font-weight:700;color:var(--brand)}
.kpi .l{font-size:12px;color:var(--muted)}
.chart{margin-top:14px}
.chart h3{font-size:14px;color:var(--muted);margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
details.role{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}
details.role>summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.role>summary::-webkit-details-marker{display:none}
details.role .inner{padding:0 16px 14px}
@media (max-width:600px){.wrap{padding:10px}header.top .who{margin-left:0;width:100%}}

.logo{background:#fff;border-radius:8px;padding:4px 8px;display:block}
header.top .logo{height:52px;width:auto}
.login .logo{width:100%;max-width:280px;margin:0 auto 12px}

,"accountant1":{"label":"Accountant – Ms. Nadeesha","sections":[{"id":"acc1_check","title":"Daily check update","unique":true,"fields":[{"k":"cash","label":"Cash counted & matched","type":"checkbox"},{"k":"bank","label":"Bank / card payments checked","type":"checkbox"},{"k":"invoices","label":"Invoices / bills checked","type":"checkbox"},{"k":"note","label":"Special note","type":"textarea"}]},{"id":"acc1_sales","title":"Daily sale report","fields":[{"k":"category","label":"Category","type":"select","options":["Consultation","Treatment","Pharmacy / Products","Lab","Other"]},{"k":"amount","label":"Amount (Rs.)","type":"number","money":true,"min":0},{"k":"note","label":"Note","type":"text"}],"summary":[{"label":"Sales today (Rs.)","field":"amount","agg":"sum","money":true}],"chart":{"title":"Monthly sales – this year vs last 3 years","mode":"monthly_compare","field":"amount","years":4}},{"id":"acc1_patients","title":"New patient crowd","unique":true,"fields":[{"k":"new_patients","label":"New patients today","type":"number","min":0,"required":true},{"k":"total_patients","label":"Total patients today","type":"number","min":0},{"k":"note","label":"Note","type":"textarea"}],"summary":[{"label":"New patients","field":"new_patients","agg":"sum"},{"label":"Total patients","field":"total_patients","agg":"sum"}],"chart":{"title":"Patient crowd (last 30 days)","mode":"daily","days":30,"series":[{"name":"New patients","field":"new_patients","agg":"sum"},{"name":"Total patients","field":"total_patients","agg":"sum"}]}}]},"accountant2":{"label":"Accountant – Mr. Krishntha","sections":[{"id":"acc2_lectures","title":"LJ EDUCARE – sir lecture details","fields":[{"k":"lecturer","label":"Sir / Lecturer","type":"text","required":true},{"k":"topic","label":"Lecture / Subject","type":"text"},{"k":"students","label":"Students","type":"number","min":0},{"k":"note","label":"Note","type":"text"}],"summary":[{"label":"Lectures","agg":"count"},{"label":"Students","field":"students","agg":"sum"}] <script>// Browser-only stand-in for server.js, used by the shareable demo page. Data lives in this browser only.
(function () {
  const { roles, seedUsers } = window.DEMO_CONFIG;
  const sectionIndex = {};
  for (const [rid, r] of Object.entries(roles)) for (const s of r.sections) sectionIndex[s.id] = { ...s, role: rid };
  const KEY = 'lj-demo-v1';
  const pad = (n) => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function seed() {
    const users = seedUsers.map((u, i) => ({ id: i + 1, ...u, active: true }));
    const uid = (r) => users.find((u) => u.role === r).id;
    const entries = []; let id = 1;
    let seedN = 7; const rnd = () => { seedN = (seedN * 16807) % 2147483647; return seedN / 2147483647; };
    const rr = (a, b) => Math.round(a + rnd() * (b - a));
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const add = (role, section, date, data) => entries.push({ id: id++, user_id: uid(role), section, date, data, updated_at: new Date().toISOString() });
    const today = todayStr();
    const prods = ['Vitamin C Serum', 'Sunscreen SPF 50', 'Hydra Facial Kit', 'Acne Gel', 'Night Cream', 'Hair Tonic'];
    for (let i = 0; i < 45; i++) {
      const d = addDays(today, -i);
      add('manager', 'mgr_stats', d, { calls: rr(25, 55), appointments: rr(6, 15), note: i === 0 ? 'Busy morning, many bridal inquiries' : undefined });
      add('manager', 'mgr_tasks', d, { web_product: rnd() > 0.3, chart_updated: true, sales_report: rnd() > 0.2, complaints_checked: rnd() > 0.2, special_note: i === 0 ? 'Supplier delivery arriving tomorrow 10am' : '' });
      if (i % 4 === 0) add('manager', 'mgr_web_products', d, { product: pick(prods), price: rr(2500, 12000) });
      if (i < 12) for (let k = 0; k < 2; k++) add('manager', 'mgr_product_sales', d, { product: pick(prods), qty: rr(1, 6), amount: rr(4000, 28000) });
      if (i % 6 === 0) add('manager', 'mgr_complaints', d, { customer: pick(['Kamani P.', 'Nuwan S.', 'Ishara D.']), complaint: 'Waited too long for appointment', status: i === 0 ? 'Open' : 'Resolved' });
      if (i % 2 === 0) add('marketing', 'mkt_videos', d, { name: pick(['Facial treatment tips', 'Meet Dr. LJ', 'Before & after', 'Skin care routine']), video_date: d, platform: pick(['Facebook', 'Instagram', 'TikTok']) });
      add('marketing', 'mkt_campaign', d, { campaign: pick(['Christmas Glow Offer', 'New Year Skin Reset']), platform: pick(['Facebook', 'Instagram']), spend: rr(1500, 6000), results: rr(40, 400) });
      if (i % 3 === 0) add('marketing', 'mkt_web_products', d, { product: pick(prods), action: pick(['Added', 'Updated']) });
      add('marketing', 'mkt_tasks', d, { videos_done: true, campaign_done: true, web_done: rnd() > 0.4, special_note: '' });
      add('accountant1', 'acc1_check', d, { cash: true, bank: true, invoices: rnd() > 0.15, note: '' });
      for (let k = 0; k < 3; k++) add('accountant1', 'acc1_sales', d, { category: pick(['Consultation', 'Treatment', 'Pharmacy / Products', 'Lab']), amount: rr(6000, 22000) });
      add('accountant1', 'acc1_patients', d, { new_patients: rr(3, 14), total_patients: rr(18, 45) });
      if (i % 3 === 0) add('accountant2', 'acc2_lectures', d, { lecturer: pick(['Dr. Perera', 'Mr. Silva']), topic: 'Skin Care Basics', students: rr(8, 30) });
      if (i % 7 === 0) add('accountant2', 'acc2_payments', d, { lecturer: pick(['Dr. Perera', 'Mr. Silva']), amount: rr(15000, 40000), status: 'Paid' });
      add('accountant2', 'acc2_lj_products', d, { product: pick(prods), qty: rr(1, 8), amount: rr(3000, 26000) });
      if (i % 2 === 0) add('accountant2', 'acc2_glorea', d, { item: 'Glorea Cleanser', qty: rr(1, 5), amount: rr(2000, 12000) });
      add('accountant2', 'acc2_cosmetics', d, { product: pick(['Lip Tint', 'BB Cream', 'Compact Powder']), qty: rr(1, 6), amount: rr(1500, 15000) });
      if (i > 0) { // receptionist has not updated today, to show the admin warning
        for (let k = 0; k < rr(2, 5); k++) add('receptionist', 'rec_customers', d, { customer: pick(['Dilani', 'Thilina', 'Sachini', 'Ruwan', 'Amaya']), phone: '07' + rr(10000000, 79999999), details: 'Follow-up call done' });
        if (i % 5 === 0) add('receptionist', 'rec_complaints', d, { customer: 'Mala F.', complaint: 'Product allergy reaction', status: 'In progress' });
        add('receptionist', 'rec_sales', d, { type: 'Sale', description: 'Day sales', amount: rr(35000, 90000) });
        add('receptionist', 'rec_sales', d, { type: 'Expense', description: pick(['Cleaning supplies', 'Tea & refreshments', 'Courier']), amount: rr(3000, 14000) });
      }
    }
    // Earlier years of monthly sales so the year-vs-year chart has history
    const cutoff = addDays(today, -45); const y = Number(today.slice(0, 4));
    for (let yr = y - 3; yr <= y; yr++) for (let m = 1; m <= 12; m++) {
      const d = `${yr}-${pad(m)}-15`; if (d >= cutoff) continue;
      const base = 450000 + (yr - (y - 3)) * 180000;
      add('accountant1', 'acc1_sales', d, { category: 'Treatment', amount: Math.round(base * (0.85 + 0.3 * Math.abs(Math.sin(m * 1.3 + yr)))) });
    }
    return { users, entries, nextId: id };
  }

  let store; try { store = JSON.parse(localStorage.getItem(KEY)); } catch { /* ignore */ }
  if (!store) store = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch { /* ignore */ } };
  let me = null;
  try { me = JSON.parse(sessionStorage.getItem(KEY + '-me')); } catch { /* ignore */ }
  const setMe = (u) => { me = u; try { sessionStorage.setItem(KEY + '-me', JSON.stringify(u)); } catch { /* ignore */ } };

  const E = (status, error) => ({ status, body: { error } });
  const isDate = (s) => typeof s === 'string' && DATE_RE.test(s);

  function clean(sec, input) {
    const out = {};
    for (const fd of sec.fields) {
      let v = input[fd.k];
      if (fd.type === 'checkbox') { out[fd.k] = v === true; continue; }
      if (v === undefined || v === null || String(v).trim() === '') { if (fd.required) return `${fd.label} is required`; continue; }
      if (fd.type === 'number') { v = Number(v); if (!Number.isFinite(v)) return `${fd.label} must be a number`; if (fd.min !== undefined && v < fd.min) return `${fd.label} must be at least ${fd.min}`; }
      else if (fd.type === 'select') { if (!fd.options.includes(v)) return `${fd.label}: invalid option`; }
      else v = String(v).trim();
      out[fd.k] = v;
    }
    return out;
  }
  const matches = (w, d) => !w || d[w.field] === w.equals;

  function chart(sec, end) {
    const c = sec.chart; const rows = store.entries.filter((e) => e.section === sec.id);
    if (c.mode === 'daily') {
      const labels = Array.from({ length: c.days }, (_, i) => addDays(end, -(c.days - 1) + i));
      const series = c.series.map((s) => ({ name: s.name, values: labels.map(() => 0) }));
      for (const r of rows) { const i = labels.indexOf(r.date); if (i < 0) continue; c.series.forEach((s, si) => { if (matches(s.where, r.data)) series[si].values[i] += s.agg === 'count' ? 1 : Number(r.data[s.field]) || 0; }); }
      return { title: c.title, mode: c.mode, labels, series };
    }
    const ey = Number(end.slice(0, 4)), em = Number(end.slice(5, 7));
    const years = Array.from({ length: c.years }, (_, i) => ey - (c.years - 1 - i));
    const series = years.map((y) => ({ name: String(y), values: Array.from({ length: 12 }, (_, m) => (y === ey && m + 1 > em ? null : 0)) }));
    for (const r of rows) { const s = series[years.indexOf(Number(r.date.slice(0, 4)))]; const m = Number(r.date.slice(5, 7)) - 1; if (s && s.values[m] !== null) s.values[m] += Number(r.data[c.field]) || 0; }
    return { title: c.title, mode: c.mode, labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], series };
  }

  function handle(method, url, body) {
    const u = new URL(url, 'http://x'); const p = u.pathname; const q = Object.fromEntries(u.searchParams);
    if (method === 'POST' && p === '/api/login') {
      const user = store.users.find((x) => x.username === String(body.username || '').trim().toLowerCase());
      if (!user || !user.active || body.password !== (user.password || 'demo')) return E(401, 'Wrong username or password (demo password is: demo)');
      setMe(user); return { status: 200, body: { ok: true } };
    }
    if (method === 'POST' && p === '/api/logout') { setMe(null); return { status: 200, body: { ok: true } }; }
    if (!me) return E(401, 'Please log in');
    const admin = me.role === 'admin';
    if (method === 'GET' && p === '/api/me') return { status: 200, body: { user: { id: me.id, username: me.username, name: me.name, role: me.role, roleLabel: roles[me.role].label }, roles: admin ? roles : { [me.role]: roles[me.role] } } };
    if (method === 'POST' && p === '/api/password') return E(400, 'Not available in the demo');
    if (p === '/api/entries' && method === 'GET') {

    }
    if (p === '/api/entries' && method === 'POST') {
      const sec = sectionIndex[body.section]; if (!sec || !isDate(body.date)) return E(400, 'Bad request');
      if (sec.role !== me.role) return E(403, 'Not allowed');
      const data = clean(sec, body.data || {}); if (typeof data === 'string') return E(400, data);
      const ex = sec.unique && store.entries.find((e) => e.user_id === me.id && e.section === sec.id && e.date === body.date);

        for (const e of mine) (sections[e.section] ||= []).push(e);

      });
      return { status: 200, body: { date: q.date, users } };
    }
    if (method === 'GET' && p === '/api/admin/users') return { status: 200, body: { users: store.users.map((x) => ({ id: x.id, username: x.username, name: x.name, role: x.role, active: x.active, roleLabel: roles[x.role].label })) } };
    if (method === 'POST' && p === '/api/admin/users') {
      if (!/^[a-z0-9._-]{3,30}$/i.test(body.username || '')) return E(400, 'Username: 3-30 letters/numbers');
      if (store.users.some((x) => x.username === body.username.toLowerCase())) return E(409, 'Username already exists');
      store.users.push({ id: store.users.length + 1, username: body.username.toLowerCase(), name: body.name, role: body.role, active: true, password: body.password }); save();
      return { status: 200, body: { ok: true } };

      const t = store.users.find((x) => x.id === Number(m[1])); if (!t) return E(404, 'Not found');
      if (body.password) t.password = body.password;
      if (body.active !== undefined) { if (t.id === me.id) return E(400, 'You cannot deactivate yourself'); t.active = !!body.active; }

    }
    return E(404, 'Not found');
  }

  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts = {}) => {
    if (typeof url === 'string' && url.startsWith('/api/')) {
      let r; try { r = handle((opts.method || 'GET').toUpperCase(), url, opts.body ? JSON.parse(opts.body) : {}); } catch (e) { r = E(500, 'Demo error'); }
      return Promise.resolve(new Response(JSON.stringify(r.body), { status: r.status, headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch(url, opts);
  };

<script>'use strict';
const $app = document.getElementById('app');
const state = { me: null, roles: {}, date: today(), tab: 'day', adminDate: today() };

// ---------- utils ----------
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('en-LK', { maximumFractionDigits: 2 });

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== '/api/login') { state.me = null; render(); throw new Error('Please log in'); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function flash(el, text, ok) {
  el.innerHTML = text ? `<div class="msg ${ok ? 'ok' : 'err'}" role="alert">${esc(text)}</div>` : '';
}
function cell(fd, v) {
  if (fd.type === 'checkbox') return v ? '✔' : '—';
  if (v === undefined || v === '') return '';
  return fd.type === 'number' && fd.money ? fmt(v) : esc(v);
}
function summaryOf(sec, entries) {
  return (sec.summary || []).map((s) => {
    const list = entries.filter((e) => !s.where || e.data[s.where.field] === s.where.equals);
    const v = s.agg === 'count' ? list.length : list.reduce((a, e) => a + (Number(e.data[s.field]) || 0), 0);
    return { label: s.label, value: v, money: s.money };
  });
}
const badges = (sum) => sum.length ? `<div class="badges">${sum.map((s) => `<span class="badge">${esc(s.label)}: <b>${fmt(s.value)}</b></span>`).join('')}</div>` : '';

// ---------- line chart (inline SVG, no libraries) ----------
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
function niceMax(v) {
  if (v <= 0) return 5;
  const p = 10 ** Math.floor(Math.log10(v)); const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function chartSvg(c) {
  const W = 700, H = 260, L = 76, R = 12, T = 12, B = 30;
  const all = c.series.flatMap((s) => s.values.filter((v) => v !== null));
  const max = niceMax(Math.max(0, ...all));
  const n = c.labels.length;
  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (n - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = (max * i) / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  }
  const step = n <= 12 ? 1 : Math.ceil(n / 8);
  c.labels.forEach((lb, i) => {
    if (i % step === 0 && (n - 1 - i >= step * 0.6 || i === n - 1)) {
      const t = c.mode === 'daily' ? lb.slice(5) : lb;
      g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(t)}</text>`;
    }
  });
  c.series.forEach((s, si) => {
    const col = COLORS[si % COLORS.length];
    let d = ''; let pen = false;
    s.values.forEach((v, i) => { if (v === null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => { if (v !== null && (n <= 31 || v > 0)) g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${col}"><title>${esc(s.name)} · ${esc(c.labels[i])}: ${fmt(v)}</title></circle>`; });
  });
  const legend = c.series.map((s, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${esc(s.name)}</span>`).join('');
  return `<div class="chart"><h3>${esc(c.title)}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">${g}</svg><div class="legend">${legend}</div></div>`;

async function loadChart(sec, el, end) {
  try { el.innerHTML = chartSvg(await api('GET', `/api/chart?section=${sec.id}&end=${end}`)); }
  catch (e) { el.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

// ---------- forms ----------
function fieldHtml(fd, v) {
  const id = `f_${fd.k}`; const req = fd.required ? ' required' : '';
  if (fd.type === 'checkbox') return `<label class="check"><input type="checkbox" name="${fd.k}" ${v ? 'checked' : ''}> ${esc(fd.label)}</label>`;
  if (fd.type === 'textarea') return `<label style="flex-basis:100%">${esc(fd.label)}<textarea name="${fd.k}" maxlength="2000"${req}>${esc(v)}</textarea></label>`;
  if (fd.type === 'select') return `<label>${esc(fd.label)}<select name="${fd.k}"${req}><option value="">–</option>${fd.options.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  const type = fd.type === 'number' ? 'number" step="any' : fd.type;
  const min = fd.min !== undefined ? ` min="${fd.min}"` : '';
  return `<label>${esc(fd.label)}<input id="${id}" type="${type}" name="${fd.k}" value="${esc(v)}"${min}${req}${fd.type === 'text' ? ' maxlength="2000"' : ''}></label>`;
}
function readForm(form, sec) {
  const data = {};
  for (const fd of sec.fields) {
    const el = form.elements[fd.k];
    data[fd.k] = fd.type === 'checkbox' ? el.checked : el.value;
  }
  return data;
}

// ---------- staff: section card ----------
async function renderSection(sec, host, date) {
  const { entries } = await api('GET', `/api/entries?section=${sec.id}&date=${date}`);
  const cols = sec.fields.filter((f) => f.type !== 'textarea' || sec.fields.length < 5);
  let body = `<h2>${esc(sec.title)}</h2>${badges(summaryOf(sec, entries))}<div class="msgbox"></div>`;
  if (sec.unique) {
    const cur = entries[0];
    body += `<form class="row">${sec.fields.map((fd) => fieldHtml(fd, cur?.data[fd.k])).join('')}
      <button class="primary" type="submit">${cur ? 'Update' : 'Save'}</button></form>`;
    if (cur) body += `<p class="muted">Saved ${new Date(cur.updated_at).toLocaleTimeString()} – you can edit and save again.</p>`;
  } else {
    body += `<form class="row">${sec.fields.map((fd) => fieldHtml(fd)).join('')}<button class="primary" type="submit">Add</button></form>`;
    if (entries.length) {
      body += `<div class="table-wrap"><table><thead><tr>${cols.map((f) => `<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead><tbody>${
        entries.map((e) => `<tr>${cols.map((f) => `<td>${cell(f, e.data[f.k])}</td>`).join('')}<td><button class="small danger" data-del="${e.id}" aria-label="Delete entry">✕</button></td></tr>`).join('')}</tbody></table></div>`;
    } else body += '<p class="muted">Nothing added for this day yet.</p>';
  }
  if (sec.chart) body += '<div class="chartbox"><p class="muted">Loading chart…</p></div>';
  host.innerHTML = body;
  const box = host.querySelector('.msgbox');
  host.querySelector('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    try {
      await api('POST', '/api/entries', { section: sec.id, date, data: readForm(ev.target, sec) });
      await renderSection(sec, host, date);
      flash(host.querySelector('.msgbox'), 'Saved ✔', true);
    } catch (e) { flash(box, e.message); }
  });
  host.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('Delete this entry?')) return;
    try { await api('DELETE', `/api/entries/${b.dataset.del}`); await renderSection(sec, host, date); } catch (e) { flash(box, e.message); }
  }));
  if (sec.chart) loadChart(sec, host.querySelector('.chartbox'), date);
}

function bindHeader() {
  document.getElementById('out').onclick = async () => { await api('POST', '/api/logout', {}); state.me = null; render(); };
  document.getElementById('pw').onclick = async () => {
    const current = prompt('Current password:'); if (current === null) return;
    const next = prompt('New password (min 8 characters):'); if (next === null) return;
    try { await api('POST', '/api/password', { current, next }); alert('Password changed. Please log in again.'); state.me = null; render(); }
    catch (e) { alert(e.message); }
  };
}

// ---------- staff view ----------
async function staffView() {
  const role = state.roles[state.me.role];
  $app.innerHTML = `${header()}<div class="wrap"><div class="card row"><label style="max-width:220px">Date
    <input type="date" id="d" value="${state.date}" max="${today()}"></label>
    <p class="muted" style="flex:1 1 240px;margin:0">Enter today's work below. You can pick an earlier date to add or fix older entries.</p></div>
    <div id="secs"></div></div>`;
  bindHeader();
  const secs = document.getElementById('secs');
  const draw = () => {
    secs.innerHTML = role.sections.map(() => '<div class="card"></div>').join('');
    role.sections.forEach((sec, i) => renderSection(sec, secs.children[i], state.date).catch((e) => { secs.children[i].textContent = e.message; }));
  };
  document.getElementById('d').onchange = (ev) => { if (ev.target.value) { state.date = ev.target.value; draw(); } };
  draw();
}

// ---------- admin ----------
const adminTabs = [['day', 'Day summary'], ['charts', 'Charts'], ['users', 'Users'], ['export', 'Export']];
async function adminView() {
  $app.innerHTML = `${header()}<div class="wrap"><div class="tabs">${adminTabs.map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}">${l}</button>`).join('')}</div><div id="pane"></div></div>`;
  bindHeader();
  $app.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; adminView(); });
  const pane = document.getElementById('pane');
  try { await ({ day: adminDay, charts: adminCharts, users: adminUsers, export: adminExport }[state.tab])(pane); }
  catch (e) { pane.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

async function adminDay(pane) {
  const data = await api('GET', `/api/admin/day?date=${state.adminDate}`);
  let totals = {}; // label -> value across everyone
  const sections = (roleId) => state.roles[roleId]?.sections || [];
  const cards = data.users.map((u) => {
    const secs = sections(u.role);
    const inner = secs.map((sec) => {
      const entries = u.sections[sec.id] || [];
      const sum = summaryOf(sec, entries);
      sum.forEach((s) => { const k = `${sec.title} – ${s.label}`; totals[k] = (totals[k] || 0) + s.value; });
      if (!entries.length) return `<h3 style="margin:14px 0 4px;font-size:15px">${esc(sec.title)}</h3><p class="muted">No entry</p>`;
      const cols = sec.fields;
      return `<h3 style="margin:14px 0 4px;font-size:15px">${esc(sec.title)}</h3>${badges(sum)}<div class="table-wrap"><table><thead><tr>${cols.map((f) => `<th>${esc(f.label)}</th>`).join('')}</tr></thead><tbody>${
        entries.map((e) => `<tr>${cols.map((f) => `<td>${cell(f, e.data[f.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }).join('');
    const done = secs.filter((s) => (u.sections[s.id] || []).length).length;
    return `<details class="role" ${u.count ? 'open' : ''}><summary><b>${esc(u.name)}</b><span class="muted">${esc(u.roleLabel)}</span>
      <span class="pill ${u.count ? 'ok' : 'no'}">${u.count ? `${done}/${secs.length} sections updated` : 'Not updated yet'}</span></summary><div class="inner">${inner}</div></details>`;
  }).join('');
  const kpis = Object.entries(totals).filter(([, v]) => v).map(([l, v]) => `<div class="kpi"><div class="v">${fmt(v)}</div><div class="l">${esc(l)}</div></div>`).join('');
  const missing = data.users.filter((u) => !u.count).map((u) => u.name);
  pane.innerHTML = `<div class="card row"><label style="max-width:220px">Date<input type="date" id="ad" value="${state.adminDate}"></label>
    <button id="prev">◀ Previous day</button><button id="next">Next day ▶</button><button id="tod">Today</button></div>
    ${missing.length ? `<div class="msg err">Not updated yet: ${esc(missing.join(', '))}</div>` : '<div class="msg ok">Everyone has updated today ✔</div>'}
    ${kpis ? `<div class="grid">${kpis}</div>` : ''}${cards}`;
  const go = (d) => { state.adminDate = d; adminView(); };
  const shift = (n) => { const d = new Date(state.adminDate + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  pane.querySelector('#ad').onchange = (e) => e.target.value && go(e.target.value);
  pane.querySelector('#prev').onclick = () => go(shift(-1));
  pane.querySelector('#next').onclick = () => go(shift(1));
  pane.querySelector('#tod').onclick = () => go(today());
}

async function adminCharts(pane) {
  const items = [];
  for (const [rid, r] of Object.entries(state.roles)) for (const s of r.sections) if (s.chart) items.push({ s, label: r.label });
  pane.innerHTML = items.map((it, i) => `<div class="card"><span class="muted">${esc(it.label)} · ${esc(it.s.title)}</span><div id="c${i}"><p class="muted">Loading…</p></div></div>`).join('');
  items.forEach((it, i) => loadChart(it.s, document.getElementById('c' + i), today()));
}

async function adminUsers(pane) {
  const { users } = await api('GET', '/api/admin/users');
  const roleOpts = Object.entries(state.roles).map(([k, r]) => `<option value="${k}">${esc(r.label)}</option>`).join('');
  pane.innerHTML = `<div class="card"><h2>Staff logins</h2><div id="um"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${
    users.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.roleLabel)}</td><td>${u.active ? '<span class="pill ok">Active</span>' : '<span class="pill no">Disabled</span>'}</td>
    <td><button class="small" data-pw="${u.id}">Reset password</button> <button class="small ${u.active ? 'danger' : ''}" data-act="${u.id}" data-to="${u.active ? 0 : 1}">${u.active ? 'Disable' : 'Enable'}</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h2>Add a new login</h2><form class="row" id="nu"><label>Name<input type="text" name="name" required></label>
    <label>Username<input type="text" name="username" required pattern="[A-Za-z0-9._-]{3,30}"></label>
    <label>Role<select name="role">${roleOpts}</select></label>
    <label>Password (min 8)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="primary">Create</button></form></div>`;
  const m = pane.querySelector('#um');
  pane.querySelectorAll('[data-pw]').forEach((b) => b.onclick = async () => {
    const p = prompt('New password (min 8 characters):'); if (!p) return;
    try { await api('PATCH', `/api/admin/users/${b.dataset.pw}`, { password: p }); flash(m, 'Password updated', true); } catch (e) { flash(m, e.message); }
  });
  pane.querySelectorAll('[data-act]').forEach((b) => b.onclick = async () => {
    try { await api('PATCH', `/api/admin/users/${b.dataset.act}`, { active: b.dataset.to === '1' }); adminView(); } catch (e) { flash(m, e.message); }
  });
  pane.querySelector('#nu').onsubmit = async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    try { await api('POST', '/api/admin/users', { name: f.name.value, username: f.username.value, role: f.role.value, password: f.password.value }); adminView(); }
    catch (e) { flash(m, e.message); }
  };
}

async function adminExport(pane) { pane.innerHTML = '<div class="card"><h2>Download report (CSV / Excel)</h2><p class="muted">Available in the real app (not in this demo).</p></div>'; }

// ---------- boot ----------
function render() {
  if (!state.me) return loginView();
  return state.me.role === 'admin' ? adminView() : staffView();
}
async function boot() {
  try { const r = await api('GET', '/api/me'); state.me = r.user; state.roles = r.roles; } catch { state.me = null; }
  render();
}
boot();
</script>
