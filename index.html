<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>World Tour Car Race 3D</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#0b1320;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{position:relative;height:100vh;height:100dvh;width:min(100vw,calc(100vh*.75));width:min(100vw,calc(100dvh*.75));touch-action:none}
  canvas#c{width:100%;height:100%;display:block;touch-action:none;background:#000}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;
    background:linear-gradient(#0b1f3af2,#10263ff2);padding:14px;padding-top:max(14px,env(safe-area-inset-top));text-align:center;overflow:auto;-webkit-overflow-scrolling:touch}
  .screen.on{display:flex}
  h1{margin:0;font-size:clamp(22px,6vw,30px)} h2{margin:12px 0 6px;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#ffd54f}
  .sub{opacity:.85;font-size:13px;margin:4px 0;max-width:400px}
  .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
  .card{background:#1b3556;border:2px solid #2d5589;border-radius:10px;padding:7px 10px;min-width:78px;cursor:pointer;font-size:12px}
  .card.sel{border-color:#ffd54f;background:#274a78}
  .card.locked{opacity:.45;cursor:not-allowed}
  .card b{display:block;font-size:13px}
  .stage{min-width:136px;max-width:210px;text-align:left}
  .tab{font-size:14px;padding:8px 14px;text-align:center}
  .fact{background:#16314f;border-left:4px solid #ffd54f;border-radius:8px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.4;max-width:400px;margin:8px 0}
  .btn{margin-top:12px;background:#ffd54f;color:#111;border:0;border-radius:12px;padding:14px 30px;font-size:18px;font-weight:700;cursor:pointer;min-height:48px}
  .btn.alt{background:#2d5589;color:#fff;font-size:14px;padding:10px 16px;margin-top:8px}
  canvas.mini{width:64px;height:44px;display:block;margin:0 auto 4px;background:none}
  #touch{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
  #game.playing.touch #touch{display:flex}
  .tbtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);
    color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .tbtn.on{background:rgba(255,213,79,.6);color:#111}
  #hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;opacity:.7;pointer-events:none;display:none}
  #game.playing:not(.touch) #hint{display:block}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="c"></canvas>
  <div id="touch"><div class="tbtn" id="bBrake">BRAKE</div><div class="tbtn" id="bBoost">BOOST</div></div>
  <div id="hint">← → steer · ↑ boost · ↓ brake</div>
  <div id="menu" class="screen on"></div>
  <div id="result" class="screen"></div>
</div></div>
<script>
const WORLDS = [
{
  id:'sydney', name:'Sydney, Australia', flag:'🇦🇺',
  cars:[
    { name:'City Hatch',     color:'#1e88e5', max:11,   steer:4.4, accel:.05,  w:34,h:60, style:'std',    need:0 },
    { name:'Harbour Sedan',  color:'#43a047', max:12,   steer:4.6, accel:.055, w:36,h:64, style:'std',    need:2 },
    { name:'Bondi Coupe',    color:'#fdd835', max:13,   steer:5.0, accel:.06,  w:36,h:62, style:'stripe', need:4 },
    { name:'Night Sports',   color:'#e53935', max:14,   steer:5.5, accel:.07,  w:36,h:62, style:'sport',  need:6 },
    { name:'Opera Supercar', color:'#8e24aa', max:15,   steer:6.2, accel:.08,  w:38,h:64, style:'sport',  need:8 },
  ],
  stages:[
    { name:'Royal Botanic Garden', L:'#3f9f4f', R:'#2e7d32', sceneL:['tree','palm','tree'], sceneR:['tree','tree','house'],
      intro:'Warm-up lap through the gardens!',
      fact:'The Royal Botanic Garden opened in 1816 and is Australia’s oldest botanic garden. Entry is free, and Mrs Macquarie’s Chair has a classic harbour view.',
      tip:'Tip: walk the harbour foreshore path at sunrise.' },
    { name:'Circular Quay', L:'#2f8fd8', R:'#2e7d32', sceneL:['opera','boat','wave'], sceneR:['tower','tree','house'],
      intro:'Welcome to Sydney Harbour!',
      fact:'The Sydney Opera House opened in 1973 and is a UNESCO World Heritage site. Circular Quay is the ferry hub of the harbour.',
      tip:'Tip: ferries are a cheap, scenic way to see the harbour.' },
    { name:'Manly Beach', L:'#35a0d8', R:'#f0d9a0', sceneL:['wave','boat'], sceneR:['palm','umbrella','house'],
      intro:'Ferry across to Manly!',
      fact:'Manly is reached by a ferry ride of roughly 30 minutes from Circular Quay, and is known for its surf beach and relaxed seaside village.',
      tip:'Tip: swim only between the red and yellow flags.' },
    { name:'Harbour Bridge Run', bridges:900, L:'#2a7fc4', R:'#2e7d32', sceneL:['boat','wave','opera'], sceneR:['tower','tree'],
      intro:'Cross the Sydney Harbour Bridge!',
      fact:'The Sydney Harbour Bridge opened in 1932 and is nicknamed “the Coathanger”. You can climb it with a guided BridgeClimb.',
      tip:'Tip: the pedestrian walkway across the bridge is free.' },
    { name:'Bondi Sunset', tint:'rgba(255,120,30,.25)', L:'#3aa0d0', R:'#f0d9a0', sceneL:['wave','boat'], sceneR:['palm','umbrella','house'],
      intro:'Golden hour at Bondi Beach!',
      fact:'Bondi is one of the world’s most famous beaches. Lifesavers patrol between the red and yellow flags.',
      tip:'Tip: the Bondi to Coogee coastal walk is a highlight.' },
    { name:'The Rocks', L:'#2a6fb0', R:'#8d7b68', sceneL:['boat','wave'], sceneR:['house','house','tower'],
      intro:'Through historic The Rocks!',
      fact:'The Rocks is Sydney’s oldest area, first settled by Europeans in 1788. It has historic pubs, laneways and weekend markets.',
      tip:'Tip: join a walking tour to learn the area’s history, including its Aboriginal heritage.' },
    { name:'Darling Harbour Night', bridges:1100, tint:'rgba(5,10,50,.55)', night:true, L:'#123a6b', R:'#1b5e20', sceneL:['boat','wave'], sceneR:['tower','tower','tree'],
      intro:'Darling Harbour by night!',
      fact:'Darling Harbour has restaurants, museums and an aquarium, and hosts regular events and fireworks.',
      tip:'Tip: visit the Australian National Maritime Museum.' },
    { name:'Blue Mountains', tint:'rgba(120,160,220,.22)', L:'#4a7fa8', R:'#2f6b3a', sceneL:['rock','tree','tree'], sceneR:['rock','tree','tree'],
      intro:'Up into the Blue Mountains!',
      fact:'The Blue Mountains are a UNESCO World Heritage area west of Sydney. The Three Sisters rock formation at Echo Point is the star attraction.',
      tip:'Tip: stay on marked trails and carry plenty of water.' },
    { name:'Anzac Bridge Storm', bridges:800, tint:'rgba(40,50,70,.5)', L:'#2d5d8a', R:'#4b5a4a', sceneL:['boat','wave'], sceneR:['tower','tower','house'],
      intro:'Storm over Anzac Bridge — stay sharp!',
      fact:'Anzac Bridge is a cable-stayed bridge that opened in 1995 and carries traffic towards the city.',
      tip:'Tip: Sydney’s public transport (Opal card) is an easy, low-carbon way to get around.' },
    { name:'Opera House Grand Prix', bridges:1000, tint:'rgba(5,5,40,.5)', night:true, L:'#0f3260', R:'#1b5e20', sceneL:['opera','boat','wave'], sceneR:['tower','tree'],
      intro:'The final race — Opera House lights!',
      fact:'Every year the Vivid Sydney festival lights up the Opera House and the city with art and music.',
      tip:'Tip: book Opera House tours ahead in peak season.' },
  ]
},
{
  id:'srilanka', name:'Sri Lanka', flag:'🇱🇰',
  cars:[
    { name:'Tuk-Tuk',         color:'#fbc02d', max:10,   steer:4.6, accel:.05,  w:30,h:46, style:'tuk',    need:0 },
    { name:'Classic Minor',   color:'#80cbc4', max:11.5, steer:4.6, accel:.055, w:34,h:60, style:'std',    need:2 },
    { name:'Safari Jeep',     color:'#8d6e63', max:12.5, steer:4.9, accel:.06,  w:38,h:62, style:'jeep',   need:4 },
    { name:'Hill Country Van',color:'#ef5350', max:13.5, steer:5.3, accel:.07,  w:38,h:66, style:'stripe', need:6 },
    { name:'Island Racer',    color:'#ff6f00', max:15,   steer:6.0, accel:.08,  w:36,h:62, style:'sport',  need:8 },
  ],
  stages:[
    { name:'Colombo – Galle Face', L:'#2f8fd8', R:'#3a7d44', sceneL:['wave','boat','wave'], sceneR:['lotus','palm','tower'],
      intro:'Welcome to Colombo, Sri Lanka!',
      fact:'Colombo is Sri Lanka’s commercial capital. Galle Face Green is a seafront promenade famous for sunsets, kite flying and street food, and the Lotus Tower is a city landmark.',
      tip:'Tip: explore the Pettah markets and the Gangaramaya Temple.' },
    { name:'Negombo Beach', L:'#2f8fd8', R:'#f0d9a0', sceneL:['boat','wave','boat'], sceneR:['palm','umbrella','palm'],
      intro:'Fishing boats at Negombo!',
      fact:'Negombo is a fishing town on the west coast, close to the main international airport. It is known for its lagoon, fish market and colourful fishing boats.',
      tip:'Tip: buy seafood from local fishers and markets to support the community.' },
    { name:'Kandy – Temple of the Tooth', L:'#3f8f6a', R:'#2e7d32', sceneL:['stupa','palm','tree'], sceneR:['temple','palm','tree'],
      intro:'Kandy – the cultural capital!',
      fact:'Kandy is a UNESCO World Heritage city. The Temple of the Sacred Tooth Relic is a major Buddhist pilgrimage site, and the Esala Perahera festival features decorated elephants and dancers.',
      tip:'Tip: dress modestly and remove shoes at temples.' },
    { name:'Anuradhapura', L:'#4f8f3a', R:'#3a7d44', sceneL:['stupa','tree','palm'], sceneR:['stupa','tree','temple'],
      intro:'Ride into the ancient capital!',
      fact:'Anuradhapura was Sri Lanka’s first ancient capital and is a UNESCO World Heritage site. Its Sri Maha Bodhi fig tree, grown from a cutting of the Buddha’s tree, was planted in the 3rd century BC.',
      tip:'Tip: hire a local guide or rent a bicycle to explore the ruins.' },
    { name:'Sigiriya – Lion Rock', tint:'rgba(255,170,40,.18)', L:'#4f8f3a', R:'#3a7d44', sceneL:['palm','tree','elephant'], sceneR:['rock','tree','elephant'],
      intro:'Race beneath Lion Rock!',
      fact:'Sigiriya is a 5th-century rock fortress rising about 200 m from the jungle, a UNESCO World Heritage site known for its frescoes and water gardens.',
      tip:'Tip: climb at sunrise to beat the heat and crowds.' },
    { name:'Trincomalee Coast', L:'#1fa0c8', R:'#f0d9a0', sceneL:['wave','boat','wave'], sceneR:['palm','temple','umbrella'],
      intro:'East coast blues at Trincomalee!',
      fact:'Trincomalee has one of the world’s great natural deep-water harbours. Nearby Nilaveli beach and Pigeon Island National Park are popular for snorkelling.',
      tip:'Tip: never touch or stand on coral when snorkelling.' },
    { name:'Nuwara Eliya & Ella', bridges:1100, bridge:'arch', tint:'rgba(200,225,235,.22)', L:'#6aa84f', R:'#38761d', sceneL:['tea','tea','tree'], sceneR:['tea','tea','house'],
      intro:'Into the misty tea country!',
      fact:'Sri Lanka’s hill country grows world-famous Ceylon tea. Nuwara Eliya is nicknamed “Little England”, and the train from Kandy to Ella is one of the world’s most scenic rides, passing the Nine Arch Bridge.',
      tip:'Tip: buy tea direct from estates to support local growers.' },
    { name:'Yala Safari', bridges:0, tint:'rgba(255,190,60,.2)', L:'#7a8f3a', R:'#6b8f2f', sceneL:['elephant','tree','elephant'], sceneR:['elephant','tree','rock'],
      intro:'Safari country — watch the road!',
      fact:'Yala National Park is famous for its leopards and also shelters elephants, crocodiles and many birds. Wild animals have the right of way.',
      tip:'Tip: stay inside the jeep, never feed wildlife, and choose operators that follow park rules.' },
    { name:'Jaffna Peninsula', bridges:900, L:'#1f8fc0', R:'#c8b27a', sceneL:['wave','boat','boat'], sceneR:['temple','palm','house'],
      intro:'Welcome to the far north — Jaffna!',
      fact:'Jaffna in the north has its own distinct culture and cuisine. Jaffna Fort was built by the Portuguese in the 17th century, and the Nallur Kandaswamy temple is a major Hindu temple.',
      tip:'Tip: try local dishes such as Jaffna crab curry at family-run restaurants.' },
    { name:'Galle Fort & Mirissa', tint:'rgba(255,110,40,.28)', L:'#1f77b4', R:'#f0d9a0', sceneL:['wave','boat','lighthouse'], sceneR:['palm','umbrella','temple'],
      intro:'Final race — sunset at Galle Fort!',
      fact:'Galle Fort, built by the Portuguese in the 16th century and expanded by the Dutch, is a UNESCO World Heritage site. Nearby Mirissa is a top spot for responsible whale watching.',
      tip:'Tip: choose whale-watching operators that follow distance guidelines for the animals.' },
  ]
}];
const DIFFS=[['Easy','#43a047'],['Medium','#fb8c00'],['Hard','#e53935'],['Expert','#9c27b0']];
// Difficulty ramps up with every stage: longer races, denser traffic, road hazards,
// two-car walls, and fewer lives.
WORLDS.forEach(w=>w.stages.forEach((s,i)=>{
  s.diff = i<2?0 : i<5?1 : i<8?2 : 3;
  s.target = 1500+i*500;
  s.traffic = +(0.8+i*0.13).toFixed(2);
  s.hazard = Math.max(0,i-2)*0.05;     // chance a spawn is a road hazard (cone)
  s.dbl = Math.max(0,i-4)*0.07;        // chance two lanes are blocked together
  s.lives = i<3?5:i<6?4:3;
}));
const coming = ['Melbourne','Kyoto','Cape Town'];
/* ================= SAVE ================= */
let save = { prog:{sydney:0,srilanka:0}, car:{sydney:0,srilanka:0}, world:0 };
try { const s=JSON.parse(localStorage.getItem('worldRace2')||'null'); if(s) save=Object.assign(save,s);
  else { const o=JSON.parse(localStorage.getItem('aussieRace')||'null'); if(o){ save.prog.sydney=o.done|0; save.car.sydney=o.car|0; } } } catch(e){}
const persist=()=>{ try{ localStorage.setItem('worldRace2',JSON.stringify(save)); }catch(e){} };

/* ================= CANVAS / LAYOUT ================= */
const gameEl=document.getElementById('game');
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const menu=document.getElementById('menu'), result=document.getElementById('result');
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch) gameEl.classList.add('touch');
let SW=480, SH=640, DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  SW=gameEl.clientWidth||480; SH=gameEl.clientHeight||640;
  cv.width=Math.round(SW*DPR); cv.height=Math.round(SH*DPR);
}
addEventListener('resize',resize); resize();

// logic space (unchanged game rules): road is 300 wide on a 480x640 field
const W=480,H=640,ROAD_X=90,ROAD_W=300,LANES=3,LANE_W=ROAD_W/LANES;

/* ================= UI ================= */
let wi=Math.min(save.world|0,WORLDS.length-1), selStage=0;
const WLD=()=>WORLDS[wi], done=()=>save.prog[WLD().id]|0;
selStage=Math.min(done(),WLD().stages.length-1);
for(const w of WORLDS){ if(w.cars[save.car[w.id]|0].need>(save.prog[w.id]|0)) save.car[w.id]=0; }

function carPreview(def){
  const c=document.createElement('canvas'); c.width=128; c.height=88; c.className='mini';
  const x=c.getContext('2d'); x.translate(64,76); x.scale(2.1,2.1); drawRear(x,def.style,def.color,def.w); return c;
}
function showMenu(){
  state='menu'; gameEl.classList.remove('playing'); result.classList.remove('on'); menu.classList.add('on'); menu.innerHTML='';
  const w=WLD(), d=done();
  menu.insertAdjacentHTML('beforeend','<h1>🏎️ World Tour Race 3D</h1><div class="sub">Race through famous places and discover them</div><h2>Choose destination</h2><div class="row" id="tabs"></div>');
  const tabs=menu.querySelector('#tabs');
  WORLDS.forEach((x,i)=>{ const t=document.createElement('div'); t.className='card tab'+(i===wi?' sel':''); t.textContent=`${x.flag} ${x.name}`;
    t.onclick=()=>{ wi=i; save.world=i; persist(); selStage=Math.min(done(),WLD().stages.length-1); showMenu(); }; tabs.appendChild(t); });
  menu.insertAdjacentHTML('beforeend','<h2>Stages</h2><div class="row" id="stg"></div><h2>Garage</h2><div class="row" id="gar"></div>');
  const stg=menu.querySelector('#stg'), gar=menu.querySelector('#gar');
  w.stages.forEach((s,i)=>{ const ok=i<=d, c=document.createElement('div');
    c.className='card stage'+(i===selStage?' sel':'')+(ok?'':' locked');
    const uc=w.cars.find(q=>q.need===i+1), dl=DIFFS[s.diff];
    c.innerHTML=`<b>${ok?'':'🔒 '}${i+1}. ${s.name}</b><span style="color:${dl[1]};font-weight:700">${dl[0]}</span> · ${s.target} m${uc?` · unlocks ${uc.name}`:''}`;
    c.onclick=()=>{ if(ok){ selStage=i; showMenu(); } }; stg.appendChild(c); });
  w.cars.forEach((cr,i)=>{ const ok=cr.need<=d, c=document.createElement('div');
    c.className='card'+(i===save.car[w.id]?' sel':'')+(ok?'':' locked');
    c.appendChild(carPreview(cr));
    c.insertAdjacentHTML('beforeend',`<b>${cr.name}</b>${ok?`Top ${Math.round(cr.max*10)} km/h`:`🔒 Beat stage ${cr.need}`}`);
    c.onclick=()=>{ if(ok){ save.car[w.id]=i; persist(); showMenu(); } }; gar.appendChild(c); });
  const go=document.createElement('button'); go.className='btn'; go.textContent=`Race: ${w.stages[selStage].name}`; go.onclick=startRace; menu.appendChild(go);
  menu.insertAdjacentHTML('beforeend',`<div class="sub" style="margin-top:10px">Coming soon: ${coming.join(' · ')}</div><div class="sub">${isTouch?'Drag to steer · hold BOOST / BRAKE':'← → steer · ↑ boost · ↓ brake'}</div>`);
}

/* ================= GAME LOGIC ================= */
let state='menu', car, enemies, dist, speed, spawnT, lives, inv, trav=0, keys={}, dragX=null, dragId=null, lastT=0, stage, world, scen, shake, introT, tilt=0;

function startRace(){
  world=WLD(); stage=world.stages[selStage];
  const def=world.cars[save.car[world.id]|0];
  car={x:W/2-def.w/2,y:H-130,w:def.w,h:def.h,def};
  enemies=[]; dist=0; speed=5; spawnT=30; lives=stage.lives; inv=0; trav=0; shake=0; introT=240; scen=[]; tilt=0;
  for(let y=-100;y<H;y+=110) addScenery(y);
  menu.classList.remove('on'); result.classList.remove('on'); state='play'; gameEl.classList.add('playing');
}
function addScenery(y){
  const side=Math.random()<.5?'L':'R', arr=side==='L'?stage.sceneL:stage.sceneR;
  scen.push({side,kind:arr[(Math.random()*arr.length)|0],y,v:Math.random()});
}

function update(dt){
  if(state!=='play') return;
  const d=car.def, steer=d.steer*dt, px=car.x;
  if(keys.arrowleft||keys.a) car.x-=steer;
  if(keys.arrowright||keys.d) car.x+=steer;
  if(dragX!==null) car.x+=Math.max(-steer,Math.min(steer,dragX-car.w/2-car.x));
  if(keys.arrowup||keys.w) speed=Math.min(speed+d.accel*dt*2,d.max);
  else if(keys.arrowdown||keys.s) speed=Math.max(speed-.15*dt,3);
  else speed=Math.min(speed+d.accel*dt*.5,d.max*.7);
  car.x=Math.max(ROAD_X+4,Math.min(ROAD_X+ROAD_W-car.w-4,car.x));
  tilt+=((car.x-px)/Math.max(.01,dt)/6-tilt)*.25;
  trav+=speed*dt*ZR/H; dist+=speed*dt*.1;
  if(inv>0) inv-=dt; if(shake>0) shake-=dt; if(introT>0) introT-=dt;
  for(const s of scen) s.y+=speed*dt; scen=scen.filter(s=>s.y<H+200);
  if(!scen.length||scen[scen.length-1].y>110) addScenery(-120);

  spawnT-=dt;
  if(spawnT<=0){
    const sl=world.id==='srilanka';
    const lanes=[0,1,2].sort(()=>Math.random()-.5);
    const nLanes=Math.random()<stage.dbl?2:1;
    if(Math.random()<stage.hazard){
      const l=lanes[0]; enemies.push({x:ROAD_X+l*LANE_W+(LANE_W-24)/2,y:-60,w:24,h:24,style:'cone',v:2,c:'#ff6d00'});
    } else for(let k=0;k<nLanes;k++){
      const lane=lanes[k], r=Math.random();
      const style=sl?(r<.45?'tuk':r<.65?'bus':'std'):'std';
      const cols=sl?['#fbc02d','#e53935','#1e88e5','#43a047','#fff176','#ef6c00']:['#e53935','#43a047','#fdd835','#8e24aa','#fb8c00','#eceff1'];
      const ew=style==='tuk'?30:style==='bus'?40:36, eh=style==='tuk'?46:style==='bus'?96:64;
      enemies.push({x:ROAD_X+lane*LANE_W+(LANE_W-ew)/2,y:-eh-30,w:ew,h:eh,style,v:1+Math.random()*2.5,c:cols[(Math.random()*cols.length)|0]});
    }
    spawnT=Math.max(18,(75-speed*3)/stage.traffic)*(.6+Math.random()*.8);
  }
  for(const e of enemies) e.y+=(speed-e.v+2)*dt;
  enemies=enemies.filter(e=>e.y<H+110);
  if(inv<=0) for(const e of enemies){
    const a={x:car.x+3,y:car.y+3,w:car.w-6,h:car.h-6};
    if(a.x<e.x+e.w&&a.x+a.w>e.x&&a.y<e.y+e.h&&a.y+a.h>e.y){
      lives--; inv=90; shake=15; speed=Math.max(4,speed*.5); e.y=H+300;
      try{ navigator.vibrate&&navigator.vibrate(90); }catch(_){}
      if(lives<=0) return finish(false);
    }
  }
  if(dist>=stage.target) finish(true);
}

function finish(win){
  state='end'; gameEl.classList.remove('playing'); keys={}; dragX=null; let html;
  if(win){
    const id=world.id, first=selStage===(save.prog[id]|0)&&selStage<world.stages.length;
    if(first){ save.prog[id]=selStage+1; persist(); }
    const nc=first?world.cars.find(q=>q.need===selStage+1):null, last=selStage===world.stages.length-1;
    html=`<h1>🏁 Stage Complete!</h1><div class="sub">${stage.name}</div>
      <div class="sub" style="color:${DIFFS[stage.diff][1]}">${DIFFS[stage.diff][0]} level cleared</div>
      <h2>Did you know?</h2><div class="fact">${stage.fact}<br><b>${stage.tip}</b></div>
      ${nc?`<h2>New car unlocked</h2><div class="card sel"><b>${nc.name}</b>Top ${Math.round(nc.max*10)} km/h</div>`:''}
      ${last?`<div class="sub" style="margin-top:10px">You’ve conquered ${world.name}! Try another destination.</div>`:''}`;
    if(!last) selStage++;
  } else html=`<h1>💥 Wrecked!</h1><div class="sub">${stage.name} · ${Math.floor(dist)} / ${stage.target} m</div>`;
  result.innerHTML=html+`<button class="btn" id="again">${win?'Continue':'Retry'}</button><button class="btn alt" id="mm">Destinations / Garage</button>`;
  result.classList.add('on');
  result.querySelector('#again').onclick=()=>win?showMenu():startRace();
  result.querySelector('#mm').onclick=showMenu;
}

/* ================= 3D PROJECTION ================= */
// Logic y (0 far … H near) is mapped to a depth z; screen scale k = ZP/z gives perspective.
const ZN=.55, ZR=8, ZP=ZN+(66/H)*ZR;           // ZP = depth of the player's rear bumper
const zOf=y=>ZN+(1-y/H)*ZR;
let HOR=0, PY=0, CC=0, S0=1, ROADHALF=0, curve=0;
function setupProj(){
  HOR=SH*.36; PY=SH*.84; CC=(PY-HOR)*ZP; ROADHALF=SW*.40; S0=ROADHALF/(ROAD_W/2);
}
function proj(y){ const z=zOf(y); if(z<.5) return null; return {z,k:ZP/z,sy:HOR+CC/z}; }
function bend(z){ const d=Math.max(0,z-ZP); return curve*d*d*SW*.0035; }

/* ================= SPRITES ================= */
function rr(g,x,y,w,h,r){ g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h); g.fill(); }
// Car seen from behind. Origin = bottom centre of the car on the ground.
function drawRear(g,style,color,w){
  const hw=w/2;
  g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(0,0,hw*1.15,hw*.24,0,0,7); g.fill();
  if(style==='cone'){ g.fillStyle='#ff6d00'; g.beginPath(); g.moveTo(0,-26); g.lineTo(hw,0); g.lineTo(-hw,0); g.fill();
    g.fillStyle='#fff'; g.fillRect(-hw*.5,-13,hw,5); return; }
  if(style==='bus'){
    g.fillStyle='#111'; g.fillRect(-hw-1,-w*.22,w*.2,w*.22); g.fillRect(hw-w*.2+1,-w*.22,w*.2,w*.22);
    g.fillStyle=color; rr(g,-hw,-w*1.6,w,w*1.45,6);
    g.fillStyle='rgba(170,215,255,.9)'; rr(g,-hw+4,-w*1.45,w-8,w*.45,3);
    g.fillStyle='#fff'; g.fillRect(-hw,-w*.78,w,4);
    g.fillStyle='#ff1744'; g.fillRect(-hw+3,-w*.4,w*.16,w*.1); g.fillRect(hw-3-w*.16,-w*.4,w*.16,w*.1); return;
  }
  if(style==='tuk'){
    g.fillStyle='#111'; g.fillRect(-hw*.9-2,-w*.28,w*.22,w*.28); g.fillRect(hw*.9-w*.22+2,-w*.28,w*.22,w*.28);
    g.fillStyle=color; rr(g,-hw,-w*.62,w,w*.42,5);
    g.fillStyle='#263238'; rr(g,-hw*.85,-w*1.2,w*.85,w*.62,6);
    g.fillStyle='rgba(255,236,150,.85)'; rr(g,-hw*.55,-w*1.05,w*.55,w*.3,3);
    g.fillStyle='#ff1744'; g.fillRect(-hw+2,-w*.5,w*.14,w*.1); g.fillRect(hw-2-w*.14,-w*.5,w*.14,w*.1); return;
  }
  const sport=style==='sport', jeep=style==='jeep';
  const bh=w*(sport?.40:.48), ch=w*(sport?.24:jeep?.46:.32), yb=-w*.09;
  g.fillStyle='#111'; g.fillRect(-hw-2,-w*.24,w*.2,w*.24); g.fillRect(hw-w*.2+2,-w*.24,w*.2,w*.24);
  g.fillStyle=color; rr(g,-hw,yb-bh,w,bh,6);
  if(jeep){ g.fillStyle=color; g.fillRect(-hw*.9,yb-bh-ch,w*.9,ch+2); g.fillStyle='rgba(170,215,255,.9)'; g.fillRect(-hw*.7,yb-bh-ch+4,w*.7,ch*.55);
    g.fillStyle='#222'; g.beginPath(); g.arc(0,yb-bh*.55,w*.17,0,7); g.fill(); g.fillStyle='#555'; g.beginPath(); g.arc(0,yb-bh*.55,w*.07,0,7); g.fill(); }
  else { g.fillStyle=color; rr(g,-hw*.78,yb-bh-ch,w*.78,ch+3,6); g.fillStyle='rgba(0,0,0,.18)'; rr(g,-hw*.78,yb-bh-ch,w*.78,ch+3,6);
    g.fillStyle='rgba(170,215,255,.92)'; rr(g,-hw*.62,yb-bh-ch+3,w*.62,ch*.7,3); }
  if(style==='stripe'||sport){ g.fillStyle='rgba(255,255,255,.6)'; g.fillRect(-w*.05,yb-bh-(jeep?0:ch),w*.1,bh+(jeep?0:ch)); }
  if(sport){ g.fillStyle='#111'; g.fillRect(-hw-3,yb-bh-ch*.55,w+6,w*.07); g.fillRect(-hw*.6,yb-bh-ch*.55,w*.07,ch*.5); g.fillRect(hw*.6-w*.07,yb-bh-ch*.55,w*.07,ch*.5); }
  g.fillStyle='#ff1744'; g.fillRect(-hw+2,yb-bh*.8,w*.2,bh*.3); g.fillRect(hw-2-w*.2,yb-bh*.8,w*.2,bh*.3);
  g.fillStyle='#fafafa'; g.fillRect(-w*.12,yb-bh*.45,w*.24,bh*.22);
}
// Roadside props: origin = base centre on the ground, drawn in the old 50-70px prop space.
function drawProp(s){
  const x=-25, y=-60, night=stage.night;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,0,26,7,0,0,7); ctx.fill();
  switch(s.kind){
    case 'opera': ctx.fillStyle='#f5f0e6'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x+i*18,y+50); ctx.quadraticCurveTo(x+i*18-10,y+10,x+i*18+30,y); ctx.quadraticCurveTo(x+i*18+22,y+30,x+i*18+34,y+50); ctx.fill(); }
      ctx.fillStyle='#c9b99a'; ctx.fillRect(x-4,y+48,70,10); break;
    case 'boat': ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(x,y+30); ctx.lineTo(x+40,y+30); ctx.lineTo(x+30,y+44); ctx.lineTo(x+8,y+44); ctx.fill();
      ctx.fillStyle='#e53935'; ctx.fillRect(x+18,y+10,4,20); ctx.fillStyle='#ffd54f'; ctx.fillRect(x+22,y+12,14,10); break;
    case 'wave': ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y+50); ctx.quadraticCurveTo(x+12,y+38,x+24,y+50); ctx.quadraticCurveTo(x+36,y+62,x+48,y+50); ctx.stroke(); break;
    case 'tower': ctx.fillStyle=night?'#27374d':'#7b8fa6'; ctx.fillRect(x,y,50,70);
      ctx.fillStyle=night?'#ffd54f':'#cfe3f5'; for(let i=0;i<4;i++) for(let j=0;j<3;j++) ctx.fillRect(x+6+j*14,y+6+i*16,8,9); break;
    case 'house': ctx.fillStyle='#d2691e'; ctx.fillRect(x,y+24,44,34); ctx.fillStyle='#8b3a0e'; ctx.beginPath(); ctx.moveTo(x-4,y+26); ctx.lineTo(x+22,y+8); ctx.lineTo(x+48,y+26); ctx.fill(); break;
    case 'tree': ctx.fillStyle='#5d4037'; ctx.fillRect(x+18,y+34,5,26); ctx.fillStyle='#1b5e20'; ctx.beginPath(); ctx.arc(x+20,y+22,22,0,7); ctx.fill(); ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(x+14,y+16,12,0,7); ctx.fill(); break;
    case 'palm': ctx.strokeStyle='#6d4c41'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x+20,y+60); ctx.quadraticCurveTo(x+26,y+34,x+22,y+12); ctx.stroke();
      ctx.fillStyle='#2e9e4f'; for(let a=0;a<6;a++){ ctx.beginPath(); ctx.ellipse(x+22+Math.cos(a)*14,y+12+Math.sin(a)*8,15,4,a,0,7); ctx.fill(); } break;
    case 'umbrella': ctx.fillStyle='#fff'; ctx.fillRect(x+19,y+24,2,34); ctx.fillStyle=['#e53935','#fdd835','#29b6f6'][(s.v*3)|0]; ctx.beginPath(); ctx.arc(x+20,y+26,18,Math.PI,0); ctx.fill(); break;
    case 'lotus': ctx.fillStyle='#e8e0f0'; ctx.fillRect(x+18,y+26,8,34); ctx.fillStyle='#c86fb0'; ctx.beginPath(); ctx.ellipse(x+22,y+16,15,22,0,0,7); ctx.fill(); ctx.fillStyle='#f4a6d7'; ctx.beginPath(); ctx.ellipse(x+22,y+16,7,18,0,0,7); ctx.fill(); break;
    case 'stupa': ctx.fillStyle='#fafafa'; ctx.beginPath(); ctx.arc(x+26,y+56,28,Math.PI,0); ctx.fill(); ctx.fillRect(x+22,y+16,8,12); ctx.fillStyle='#ffd54f'; ctx.fillRect(x+24,y+6,4,10); break;
    case 'temple': ctx.fillStyle='#f3e5c0'; ctx.fillRect(x,y+30,54,28); ctx.fillStyle='#b5651d'; ctx.beginPath(); ctx.moveTo(x-6,y+32); ctx.lineTo(x+27,y+8); ctx.lineTo(x+60,y+32); ctx.fill(); ctx.fillStyle='#ffd54f'; ctx.fillRect(x+24,y+2,6,8); break;
    case 'rock': ctx.fillStyle='#8d6e63'; ctx.beginPath(); ctx.moveTo(x-8,y+60); ctx.lineTo(x+2,y+14); ctx.lineTo(x+16,y+4); ctx.lineTo(x+40,y+4); ctx.lineTo(x+56,y+20); ctx.lineTo(x+64,y+60); ctx.fill();
      ctx.fillStyle='#4f8f3a'; ctx.fillRect(x+14,y,30,6); break;
    case 'elephant': ctx.fillStyle='#78909c'; ctx.beginPath(); ctx.ellipse(x+24,y+34,20,14,0,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(x+7,y+28,9,0,7); ctx.fill();
      ctx.fillRect(x-4,y+28,6,22); ctx.fillStyle='#546e7a'; ctx.fillRect(x+10,y+42,6,16); ctx.fillRect(x+30,y+42,6,16); break;
    case 'tea': ctx.fillStyle='#2e8b3d'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(x+24,y+26+i*12,28,6,0,0,7); ctx.fill(); }
      ctx.fillStyle='#1c6b2a'; for(let i=0;i<3;i++) ctx.fillRect(x+2,y+29+i*12,44,2); break;
    case 'lighthouse': ctx.fillStyle='#fafafa'; ctx.beginPath(); ctx.moveTo(x+6,y+60); ctx.lineTo(x+14,y+12); ctx.lineTo(x+30,y+12); ctx.lineTo(x+38,y+60); ctx.fill();
      ctx.fillStyle='#e53935'; ctx.fillRect(x+11,y+34,24,7); ctx.fillStyle='#ffd54f'; ctx.fillRect(x+14,y+4,16,8); break;
  }
}
function drawGantry(p){
  const cx=SW/2+bend(p.z), half=ROADHALF*p.k*1.12, u=S0*p.k;
  const top=p.sy-150*u, bh=28*u, pw=18*u, arch=stage.bridge==='arch';
  ctx.fillStyle=arch?'#9c8a6a':'#546e7a'; ctx.fillRect(cx-half-pw,top,pw,p.sy-top); ctx.fillRect(cx+half,top,pw,p.sy-top);
  ctx.fillStyle=arch?'#b9a78c':'#78909c'; ctx.fillRect(cx-half-pw,top,2*(half+pw),bh);
  if(arch){ ctx.fillStyle='rgba(0,0,0,.35)'; const n=7, bw=2*half/n; for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(cx-half+bw*(i+.5),top+bh,bw*.38,Math.PI,0); ctx.fill(); } }
  else { ctx.strokeStyle='#cfd8dc'; ctx.lineWidth=Math.max(1,3*u); ctx.beginPath(); const n=12, bw=2*half/n;
    for(let i=0;i<n;i++){ ctx.moveTo(cx-half+bw*i,top); ctx.lineTo(cx-half+bw*(i+.5),top+bh); ctx.lineTo(cx-half+bw*(i+1),top); } ctx.stroke(); }
}

/* ================= RENDER ================= */
function skyColors(){
  if(stage.night) return ['#04081f','#1b2a5e'];
  if(stage.tint&&/255,1[0-9]0/.test(stage.tint)) return ['#ff8a50','#ffd9a0'];
  if(stage.tint&&/40,50,70/.test(stage.tint)) return ['#59606d','#9aa3ae'];
  return ['#4aa8ee','#cfeaff'];
}
function wrapText(text,maxW){ const words=text.split(' '),lines=[]; let l=''; for(const w of words){ const t=l?l+' '+w:w; if(ctx.measureText(t).width>maxW){ lines.push(l); l=w; } else l=t; } lines.push(l); return lines; }

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  setupProj();
  if(!stage){ ctx.fillStyle='#0b1320'; ctx.fillRect(0,0,SW,SH); return; }
  curve=state==='play'?Math.sin(dist/140)*Math.sin(dist/410+1)*(.5+stage.diff*.25):curve;
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);

  // sky + distant skyline
  const sc=skyColors(), g=ctx.createLinearGradient(0,0,0,HOR); g.addColorStop(0,sc[0]); g.addColorStop(1,sc[1]);
  ctx.fillStyle=g; ctx.fillRect(-10,-10,SW+20,HOR+12);
  const off=-bend(ZR*1.1)*.25; ctx.fillStyle=stage.night?'#0b1233':world.id==='sydney'?'#7da3c4':'#4d7f5e';
  ctx.beginPath(); ctx.moveTo(-20,HOR);
  if(world.id==='sydney'){ for(let x=-20,i=0;x<SW+40;x+=SW/14,i++){ const h=SH*(.03+((i*37)%11)/11*.06); ctx.lineTo(x+off,HOR-h); ctx.lineTo(x+SW/14-3+off,HOR-h); } }
  else { for(let x=-20;x<SW+60;x+=SW/6){ ctx.quadraticCurveTo(x+SW/12+off,HOR-SH*(.05+((x*7)%5)/60),x+SW/6+off,HOR); } }
  ctx.lineTo(SW+40,HOR); ctx.fill();

  // ground, road (scanline strips for perspective)
  for(let sy=Math.floor(HOR);sy<SH;sy+=2){
    const z=CC/Math.max(1,sy-HOR), k=ZP/z, half=ROADHALF*k, cx=SW/2+bend(z);
    const band=Math.floor((z+trav)/.5)&1;
    ctx.fillStyle=stage.L; ctx.fillRect(0,sy,cx,3);
    ctx.fillStyle=stage.R; ctx.fillRect(cx,sy,SW-cx,3);
    if(band){ ctx.fillStyle='rgba(0,0,0,.09)'; ctx.fillRect(0,sy,SW,3); }
    const rw=Math.max(1,half*.07);
    ctx.fillStyle=band?'#e53935':'#f5f5f5'; ctx.fillRect(cx-half-rw,sy,rw,3); ctx.fillRect(cx+half,sy,rw,3);
    ctx.fillStyle=band?'#3a3a3a':'#424242'; ctx.fillRect(cx-half,sy,half*2,3);
    if(band){ ctx.fillStyle='#fff'; const lw=Math.max(1,half*.02); ctx.fillRect(cx-half/3-lw/2,sy,lw,3); ctx.fillRect(cx+half/3-lw/2,sy,lw,3); }
  }
  const fg=ctx.createLinearGradient(0,HOR,0,HOR+SH*.14); fg.addColorStop(0,sc[1]); fg.addColorStop(1,'rgba(255,255,255,0)'); ctx.globalAlpha=.8; ctx.fillStyle=fg; ctx.fillRect(0,HOR,SW,SH*.14); ctx.globalAlpha=1;

  // collect and draw sprites far → near
  const items=[];
  for(const s of scen) items.push({y:s.y,t:'p',o:s});
  for(const e of enemies) items.push({y:e.y+e.h,t:'e',o:e});
  if(stage.bridges){ const pos=(dist*10)%stage.bridges; if(pos<80) items.push({y:pos*(H+60)/80-60,t:'b'}); }
  items.push({y:car.y+car.h,t:'c'});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    if(it.t==='c'){ drawPlayer(); continue; }
    const p=proj(it.y); if(!p) continue;
    if(it.t==='b'){ drawGantry(p); continue; }
    const cx=SW/2+bend(p.z);
    if(it.t==='p'){
      const s=it.o, u=(s.side==='L'?-1:1)*(1.3+s.v*1.1), sx=cx+u*ROADHALF*p.k, sc2=p.k*S0*1.9;
      ctx.save(); ctx.translate(sx,p.sy); ctx.scale(sc2,sc2); drawProp(s); ctx.restore();
    } else {
      const e=it.o, u=(e.x+e.w/2-W/2)/(ROAD_W/2), sx=cx+u*ROADHALF*p.k, sc2=p.k*S0*1.5;
      ctx.save(); ctx.translate(sx,p.sy); ctx.scale(sc2,sc2); drawRear(ctx,e.style,e.c,e.w); ctx.restore();
    }
  }
  ctx.restore();

  if(stage.tint){ ctx.fillStyle=stage.tint; ctx.fillRect(0,0,SW,SH); }
  if(stage.night){ const lg=ctx.createRadialGradient(SW/2,PY-SH*.12,10,SW/2,PY-SH*.3,SW*.6);
    lg.addColorStop(0,'rgba(255,240,180,.3)'); lg.addColorStop(1,'rgba(255,240,180,0)'); ctx.fillStyle=lg; ctx.fillRect(0,0,SW,SH); }
  if(state==='play'&&speed>car.def.max*.85){ ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2, r0=SH*.3, r1=SH*.55; ctx.moveTo(SW/2+Math.cos(a)*r0*1.1,PY-SH*.25+Math.sin(a)*r0*.7); ctx.lineTo(SW/2+Math.cos(a)*r1*1.1,PY-SH*.25+Math.sin(a)*r1*.7); } ctx.stroke(); }
  drawHUD();
}
function drawPlayer(){
  const p={k:1}, u=(car.x+car.w/2-W/2)/(ROAD_W/2), sx=SW/2+u*ROADHALF, sc2=S0*1.5;
  if(inv>0&&((inv/6)|0)%2) return;
  ctx.save(); ctx.translate(sx,PY+Math.sin(trav*40)*1.2); ctx.rotate(tilt*.03); ctx.scale(sc2,sc2); drawRear(ctx,car.def.style,car.def.color,car.w); ctx.restore();
}
function drawHUD(){
  if(state!=='play'&&state!=='end') return;
  const fs=Math.max(12,Math.round(SW*.035)), top=Math.max(0,0);
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,SW,fs*2.3);
  ctx.fillStyle='#fff'; ctx.font=`bold ${fs}px system-ui`; ctx.textBaseline='middle';
  ctx.textAlign='left'; ctx.fillText(stage.name,10,fs*.95);
  ctx.textAlign='center'; ctx.fillText('❤'.repeat(Math.max(0,lives)),SW*.62,fs*.95);
  ctx.textAlign='right'; ctx.fillText(`${Math.floor(speed*10)} km/h`,SW-10,fs*.95);
  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(10,fs*1.6,SW-20,fs*.4);
  ctx.fillStyle='#ffd54f'; ctx.fillRect(10,fs*1.6,(SW-20)*Math.min(1,dist/stage.target),fs*.4);
  if(introT>0&&state==='play'){
    ctx.globalAlpha=Math.min(1,introT/40); ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(SW*.05,SH*.14,SW*.9,fs*4.6);
    ctx.fillStyle='#ffd54f'; ctx.textAlign='center'; ctx.font=`bold ${fs*1.35}px system-ui`;
    const lines=wrapText(stage.intro,SW*.84); lines.forEach((l,i)=>ctx.fillText(l,SW/2,SH*.14+fs*1.5+i*fs*1.5));
    ctx.fillStyle='#fff'; ctx.font=`${fs*.95}px system-ui`; ctx.fillText(`${world.flag} ${DIFFS[stage.diff][0]} · ${stage.target} m`,SW/2,SH*.14+fs*4); ctx.globalAlpha=1;
  }
  ctx.textBaseline='alphabetic';
}
function loop(t){ const dt=Math.min(2,(t-lastT)/16.67||1); lastT=t; update(dt); draw(); requestAnimationFrame(loop); }

/* ================= INPUT ================= */
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function setDrag(e){ const r=cv.getBoundingClientRect(); const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); dragX=ROAD_X+f*ROAD_W; }
cv.addEventListener('pointerdown',e=>{ dragId=e.pointerId; try{cv.setPointerCapture(e.pointerId);}catch(_){} setDrag(e); });
cv.addEventListener('pointermove',e=>{ if(e.pointerId===dragId) setDrag(e); });
const endDrag=e=>{ if(e.pointerId===dragId){ dragId=null; dragX=null; } };
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
function holdBtn(id,key){ const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[key]=true; b.classList.add('on'); try{b.setPointerCapture(e.pointerId);}catch(_){} });
  const up=()=>{ keys[key]=false; b.classList.remove('on'); }; b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); }
holdBtn('bBoost','arrowup'); holdBtn('bBrake','arrowdown');
gameEl.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('contextmenu',e=>e.preventDefault());

showMenu(); requestAnimationFrame(loop);
</script>
